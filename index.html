<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LoL Draft Simulator</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================
         SETUP SCREEN
    ========================== -->

    <main
        id="setupScreen"
        class="screen setup-screen"
    >

        <div class="setup-container">

            <header class="page-header">
                <h1>LoL Draft Simulator</h1>
                <p>League of Legends Pick & Ban Simulator</p>
            </header>


            <!-- TEAM SETTING -->

            <section class="setup-section">

                <h2>팀 설정</h2>

                <div class="team-settings">

                    <!-- BLUE -->

                    <div class="team-setting blue-setting">

                        <div class="team-label">
                            BLUE SIDE
                        </div>

                        <input
                            id="blueTeam"
                            type="text"
                            placeholder="Blue Team"
                            autocomplete="off"
                        >

                        <input
                            id="blueLogo"
                            type="text"
                            placeholder="팀 로고 이미지 URL"
                            autocomplete="off"
                        >

                        <div class="logo-preview">
                            <img
                                id="blueLogoPreview"
                                src=""
                                alt="Blue Logo"
                            >
                        </div>

                    </div>


                    <!-- RED -->

                    <div class="team-setting red-setting">

                        <div class="team-label">
                            RED SIDE
                        </div>

                        <input
                            id="redTeam"
                            type="text"
                            placeholder="Red Team"
                            autocomplete="off"
                        >

                        <input
                            id="redLogo"
                            type="text"
                            placeholder="팀 로고 이미지 URL"
                            autocomplete="off"
                        >

                        <div class="logo-preview">
                            <img
                                id="redLogoPreview"
                                src=""
                                alt="Red Logo"
                            >
                        </div>

                    </div>

                </div>

            </section>


            <!-- SERIES -->

            <section class="setup-section">

                <h2>경기 방식</h2>

                <div class="series-buttons">

                    <button
                        type="button"
                        class="series-button active"
                        data-series="1"
                    >
                        BO1
                    </button>

                    <button
                        type="button"
                        class="series-button"
                        data-series="3"
                    >
                        BO3
                    </button>

                    <button
                        type="button"
                        class="series-button"
                        data-series="5"
                    >
                        BO5
                    </button>

                </div>

            </section>


            <!-- DRAFT MODE -->

            <section class="setup-section">

                <h2>드래프트 방식</h2>

                <div class="mode-buttons">

                    <button
                        type="button"
                        class="mode-button active"
                        data-mode="standard"
                    >
                        일반 드래프트
                    </button>

                    <button
                        type="button"
                        class="mode-button"
                        data-mode="fearless"
                    >
                        피어리스 드래프트
                    </button>

                </div>

            </section>


            <!-- TIMER -->

            <section class="setup-section">

                <div class="timer-setting">

                    <div class="setting-title">
                        시간 제한
                    </div>

                    <div class="timer-options">

                        <button
                            type="button"
                            id="timerEnabled"
                            class="timer-option active"
                        >
                            시간 제한 사용
                        </button>

                        <button
                            type="button"
                            id="timerDisabled"
                            class="timer-option"
                        >
                            시간 제한 없음
                        </button>

                    </div>

                </div>

            </section>


            <!-- START -->

            <button
                id="startDraft"
                class="start-button"
                type="button"
            >
                DRAFT START
            </button>


            <!-- SAVED RESULTS -->

            <section
                id="savedResultsSection"
                class="saved-section"
            >

                <h2>저장된 드래프트</h2>

                <div id="savedResults">
                    <div class="no-saved-result">
                        저장된 결과가 없습니다.
                    </div>
                </div>

            </section>

        </div>

    </main>



    <!-- =========================
         DRAFT SCREEN
    ========================== -->

    <main
        id="draftScreen"
        class="screen draft-screen hidden"
    >

        <div class="draft-container">


            <!-- TOP BAR -->

            <header class="draft-header">

                <div class="draft-team blue-team">

                    <img
                        id="draftBlueLogo"
                        src=""
                        alt=""
                    >

                    <span id="draftBlueTeam">
                        BLUE
                    </span>

                </div>


                <div class="draft-title">

                    <div class="game-number">
                        DRAFT
                    </div>

                    <div
                        id="currentAction"
                        class="current-action"
                    >
                        대기 중
                    </div>

                </div>


                <div class="draft-team red-team">

                    <span id="draftRedTeam">
                        RED
                    </span>

                    <img
                        id="draftRedLogo"
                        src=""
                        alt=""
                    >

                </div>

            </header>



            <!-- TIMER -->

            <div class="timer-box">

                <div class="timer-label">
                    TIME
                </div>

                <div
                    id="timer"
                    class="timer"
                >
                    30
                </div>

            </div>



            <!-- DRAFT AREA -->

            <section class="draft-area">


                <!-- BLUE SIDE -->

                <aside class="draft-side blue-side">

                    <h2>BLUE</h2>

                    <div class="side-title">
                        BAN
                    </div>

                    <div
                        id="blueBans"
                        class="ban-list"
                    ></div>


                    <div class="side-title">
                        PICK
                    </div>

                    <div
                        id="bluePicks"
                        class="pick-list"
                    ></div>

                </aside>



                <!-- CENTER -->

                <section class="champion-section">

                    <!-- SEARCH -->

                    <div class="search-area">

                        <input
                            id="championSearch"
                            type="text"
                            placeholder="챔피언 검색"
                            autocomplete="off"
                        >

                    </div>


                    <!-- LANE FILTER -->

                    <div
                        id="laneFilter"
                        class="lane-filter"
                    >

                        <button
                            type="button"
                            class="lane-button active"
                            data-lane="ALL"
                        >
                            전체
                        </button>

                        <button
                            type="button"
                            class="lane-button"
                            data-lane="TOP"
                        >
                            TOP
                        </button>

                        <button
                            type="button"
                            class="lane-button"
                            data-lane="JUNGLE"
                        >
                            JUNGLE
                        </button>

                        <button
                            type="button"
                            class="lane-button"
                            data-lane="MID"
                        >
                            MID
                        </button>

                        <button
                            type="button"
                            class="lane-button"
                            data-lane="ADC"
                        >
                            ADC
                        </button>

                        <button
                            type="button"
                            class="lane-button"
                            data-lane="SUPPORT"
                        >
                            SUPPORT
                        </button>

                    </div>


                    <!-- CHAMPION GRID -->

                    <div
                        id="championGrid"
                        class="champion-grid"
                    >

                        <div class="loading">
                            챔피언 데이터를 불러오는 중...
                        </div>

                    </div>


                    <!-- LOCK PREVIEW -->

                    <div class="lock-area">

                        <div
                            id="lockPreview"
                            class="lock-preview"
                        ></div>

                        <div class="lock-buttons">

                            <button
                                id="cancelButton"
                                type="button"
                                class="cancel-button"
                            >
                                취소
                            </button>

                            <button
                                id="lockButton"
                                type="button"
                                class="lock-button"
                            >
                                LOCK
                            </button>

                        </div>

                    </div>

                </section>



                <!-- RED SIDE -->

                <aside class="draft-side red-side">

                    <h2>RED</h2>

                    <div class="side-title">
                        BAN
                    </div>

                    <div
                        id="redBans"
                        class="ban-list"
                    ></div>


                    <div class="side-title">
                        PICK
                    </div>

                    <div
                        id="redPicks"
                        class="pick-list"
                    ></div>

                </aside>

            </section>



            <!-- BOTTOM CONTROLS -->

            <div class="draft-controls">

                <button
                    id="undoButton"
                    type="button"
                >
                    UNDO
                </button>

                <button
                    id="resetButton"
                    type="button"
                >
                    RESET
                </button>

            </div>

        </div>

    </main>



    <!-- =========================
         FINAL SCREEN
    ========================== -->

    <main
        id="finalScreen"
        class="screen final-screen hidden"
    >

        <div class="final-container">


            <!-- HEADER -->

            <header class="final-header">

                <div class="final-team blue-team">

                    <img
                        id="finalBlueLogo"
                        src=""
                        alt=""
                    >

                    <div>
                        <span class="final-side">
                            BLUE
                        </span>

                        <h1 id="finalBlueTeam">
                            BLUE
                        </h1>
                    </div>

                </div>


                <div class="final-vs">
                    VS
                </div>


                <div class="final-team red-team">

                    <div>
                        <span class="final-side">
                            RED
                        </span>

                        <h1 id="finalRedTeam">
                            RED
                        </h1>
                    </div>

                    <img
                        id="finalRedLogo"
                        src=""
                        alt=""
                    >

                </div>

            </header>



            <!-- BANS -->

            <section class="result-section">

                <h2>BANS</h2>

                <div class="result-bans">

                    <div class="result-team">

                        <h3>
                            BLUE BANS
                        </h3>

                        <div
                            id="finalBlueBans"
                            class="final-champion-list"
                        ></div>

                    </div>


                    <div class="result-team">

                        <h3>
                            RED BANS
                        </h3>

                        <div
                            id="finalRedBans"
                            class="final-champion-list"
                        ></div>

                    </div>

                </div>

            </section>



            <!-- PICKS -->

            <section class="result-section">

                <h2>PICKS</h2>

                <div class="result-picks">

                    <div class="result-team">

                        <h3>
                            BLUE PICKS
                        </h3>

                        <div
                            id="finalBluePicks"
                            class="final-champion-list"
                        ></div>

                    </div>


                    <div class="result-team">

                        <h3>
                            RED PICKS
                        </h3>

                        <div
                            id="finalRedPicks"
                            class="final-champion-list"
                        ></div>

                    </div>

                </div>

            </section>



            <!-- RESULT BUTTONS -->

            <div class="final-buttons">

                <button
                    id="saveResultButton"
                    type="button"
                    class="save-button"
                >
                    결과 저장
                </button>

                <button
                    id="nextGameButton"
                    type="button"
                    class="next-game-button"
                >
                    다음 게임
                </button>

            </div>

        </div>

    </main>



    <script src="app.js"></script>

</body>
</html>
